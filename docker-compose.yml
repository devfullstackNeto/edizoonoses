services:
  db:
    image: mirror.gcr.io/postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: edi
      POSTGRES_USER: edi
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edi}
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U edi -d edi"]
      interval: 5s
      retries: 20
  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 20
  minio:
    image: bitnamilegacy/minio:2025.7.23
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY:-edi}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY:-edi-demo-local-only}
    ports:
      - "9001:9001"
    volumes:
      - minio_data:/bitnami/minio/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/live >/dev/null"]
      interval: 10s
      retries: 20
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment: &api_environment
      DATABASE_URL: postgresql+psycopg://edi:${POSTGRES_PASSWORD:-edi}@db:5432/edi
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY:-edi}
      S3_SECRET_KEY: ${S3_SECRET_KEY:-edi-demo-local-only}
      JWT_SECRET: ${JWT_SECRET:-local-demo-change-before-network-exposure}
      DEMO_PASSWORD: ${DEMO_PASSWORD:-Demo@2026}
      CORS_ORIGINS: http://localhost:8090,http://localhost:5173
      OSRM_BASE_URL: ${OSRM_BASE_URL:-}
      AI_PROVIDER: ${AI_PROVIDER:-mock}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      GEOCODER_BASE_URL: ${GEOCODER_BASE_URL:-}
      GEOCODER_USER_AGENT: ${GEOCODER_USER_AGENT:-EDI-Zoonoses-Demo/1.0 (local technical pilot)}
      LOCATION_RETENTION_DAYS: ${LOCATION_RETENTION_DAYS:-30}
      GEOFENCE_RADIUS_M: ${GEOFENCE_RADIUS_M:-100}
    ports:
      - "8010:8000"
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')"]
      interval: 10s
      start_period: 30s
      retries: 20
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: rq worker ocr --url redis://redis:6379/0
    environment: *api_environment
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "from redis import Redis; assert Redis.from_url('redis://redis:6379/0').ping()"]
      interval: 10s
      retries: 20
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    ports:
      - "8090:80"
    depends_on:
      api: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/"]
      interval: 10s
      retries: 20
volumes:
  db_data:
  minio_data:
